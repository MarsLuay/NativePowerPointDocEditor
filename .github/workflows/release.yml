name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify committed DOCX runtime
        run: npm run check:docx-runtime

      - name: Validate release version
        run: node scripts/check-release-version.mjs

      - name: Verify and build plugin
        run: npm run verify:review

      - name: Confirm release artifacts exist
        run: |
          test -f main.js
          test -f styles.css
          test -f manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          man = json.loads(Path('manifest.json').read_text())
          pkg = json.loads(Path('package.json').read_text())
          assert man['version'] == pkg['version'], (man['version'], pkg['version'])
          print('release artifacts ready', man['version'])
          PY

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            main.js
            styles.css
            manifest.json
