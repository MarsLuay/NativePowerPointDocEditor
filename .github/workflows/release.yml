name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        # TypeScript 7 is intentionally pinned, while typescript-eslint's published peer range still stops below TS 7.
        # Preserve the lockfile exactly and bypass npm's peer-resolution failure until upstream declares TS 7 support.
        run: npm ci --legacy-peer-deps

      - name: Regenerate PPTX JS fallback when dependency changed
        shell: bash
        run: |
          if ! node scripts/check-pptx-js-engine-version.mjs; then
            INSTALL_MOONBIT=1 npm run regen:pptx-js
          fi

      - name: Validate vendored DOCX runtime
        run: npm run check:docx-runtime

      - name: Validate release version
        run: node scripts/check-release-version.mjs

      - name: Verify plugin
        run: npm run verify

      - name: Generate artifact attestation for main.js
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'main.js'

      - name: Generate artifact attestation for styles.css
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'styles.css'

      - name: Generate artifact attestation for manifest.json
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'manifest.json'

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            main.js
            styles.css
            manifest.json
