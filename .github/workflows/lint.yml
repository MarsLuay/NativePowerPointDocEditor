name: DOCX editor source

on:
    push:
        branches: [docx-editor-source]
    pull_request:
        branches: [docx-editor-source]

jobs:
    docx-editor:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: docx-editor

        steps:
            - uses: actions/checkout@v6
            - uses: actions/checkout@v6
              with:
                  ref: nightly-releases
                  path: NativePowerPointDocEditor
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run build
            - run: bun run typecheck
            - run: bun run test
            - run: bun run check:npde-contract
              env:
                  NPDE_PLUGIN_DIR: ${{ github.workspace }}/NativePowerPointDocEditor
